name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Test and build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python tools/check_repository_hygiene.py
          ruff check uac_parser tests tools
          ruff format --check uac_parser tests tools
          mypy uac_parser
          bandit -q -c pyproject.toml -r uac_parser
          python tools/check_web_resources.py
          node --check web/app.js
          coverage run -m unittest discover -s tests -v
          coverage report
          pip-audit . --strict --progress-spinner off
          python -m build
          python -m twine check dist/*
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/tracequarry-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Package Agent Skill
        run: python tools/package_agent_skill.py --output dist/tracequarry-skill.zip
      - name: Generate checksums
        working-directory: dist
        run: sha256sum tracequarry-* > SHA256SUMS
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --generate-notes \
            --verify-tag \
            "${release_flags[@]}"
