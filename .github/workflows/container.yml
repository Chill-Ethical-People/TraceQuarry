name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build container
        run: docker build --pull --tag tracequarry:ci .
      - name: Verify CLI and non-root runtime
        run: |
          docker run --rm --entrypoint tracequarry tracequarry:ci --help
          test "$(docker image inspect --format '{{.Config.User}}' tracequarry:ci)" = "tracequarry:tracequarry"
      - name: Exercise health check and persistent case volume
        run: |
          set -eu
          volume="tracequarry-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="tracequarry-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --detach --name "$container" \
            --publish 127.0.0.1:18765:8765 \
            --env TRACEQUARRY_PUBLIC_PORT=18765 \
            --volume "$volume:/data" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            tracequarry:ci >/dev/null
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          docker exec "$container" python -c \
            "from pathlib import Path; Path('/data/persistence-marker').write_text('preserved')"
          docker rm --force "$container" >/dev/null
          docker run --rm --volume "$volume:/data:ro" --entrypoint python tracequarry:ci -c \
            "from pathlib import Path; assert Path('/data/persistence-marker').read_text() == 'preserved'"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/chill-ethical-people/tracequarry
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
